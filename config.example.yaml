# Prospekt Monitor — config.example.yaml
# Kopiera till config.yaml och fyll i dina värden.
# config.yaml är i .gitignore och committas ALDRIG.

storage:
  download_dir: "/data/prospekt/pdf"
  db_path: "/data/prospekt/monitor.db"

polling:
  interval_hours: 6

email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  username: "din@gmail.com"
  password: "xxxx-xxxx-xxxx-xxxx"   # Gmail App Password
  from_addr: "din@gmail.com"
  to_addrs:
    - "din@gmail.com"

# Sätt enabled: false för att stänga av en provider
ai_providers:
  claude:
    enabled: true
    api_key: "sk-ant-..."
    model: "claude-sonnet-4-6"
  openai:
    enabled: true
    api_key: "sk-..."
    model: "gpt-4.1"
  gemini:
    enabled: true
    api_key: "AIza..."
    model: "gemini-2.5-pro"

analysis:
  # Minsta konsensuspoäng för att skicka notis (0 = skicka alltid)
  min_score_to_notify: 0

home_assistant:
  # URL till din HA-instans (inifrån NAS-nätverket)
  url: "http://homeassistant.local:8123"
  # Long-Lived Access Token: HA → Profil → Säkerhet → Åtkomsttokens → Skapa token
  token: "eyJ..."
  # Enhetsnamn på din mobil: HA → Inställningar → Companion-appen → Enhetsnamn
  # Ersätt mellanslag med underscore och gör lowercase, t.ex. "Lars iPhone" → "lars_iphone"
  mobile_app: "lars_iphone"
  # Webhook-ID: skapa en automation i HA med trigger "Webhook" och klistra in ID:t
  webhook_id: "prospekt_monitor_abc123"
